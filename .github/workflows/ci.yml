name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

  windows:
    name: windows (mingw, cmd)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
      - name: Build
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;C:\msys64\usr\bin;%PATH%
          make -f Makefile
      - name: Test
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw64\bin;C:\msys64\usr\bin;%PATH%
          make -f Makefile test
